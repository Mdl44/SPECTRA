authoritative;
default-lease-time 86400;
max-lease-time 172800;
ddns-update-style none;

option domain-name "corp.net";
option domain-name-servers 10.0.14.142;
option ntp-servers 10.0.14.142;

# Management VLAN (Server's own interface) - Required for isc-dhcp-server to start
# Rezervarile per-MAC pentru ZTP (echipamente noi) vin din ztp-hosts.conf, gestionat de aplicatie
subnet 10.0.14.128 netmask 255.255.255.240 {
  include "/etc/dhcp/ztp-hosts.conf";
}

# R&D
subnet 10.0.0.0 netmask 255.255.248.0 {
  range 10.0.0.21 10.0.7.254;
  option routers 10.0.0.1;
}

# SOC
subnet 10.0.8.0 netmask 255.255.254.0 {
  range 10.0.8.21 10.0.9.254;
  option routers 10.0.8.1;
}

# Data Center
subnet 10.0.10.0 netmask 255.255.254.0 {
  range 10.0.10.21 10.0.11.254;
  option routers 10.0.10.1;
}

# Guest
subnet 10.0.12.0 netmask 255.255.255.0 {
  range 10.0.12.21 10.0.12.254;
  option routers 10.0.12.1;
}

# Malware Lab
subnet 10.0.13.0 netmask 255.255.255.128 {
  range 10.0.13.21 10.0.13.126;
  option routers 10.0.13.1;
}

# Sales
subnet 10.0.13.128 netmask 255.255.255.192 {
  range 10.0.13.140 10.0.13.190;
  option routers 10.0.13.129;
}

# Marketing
subnet 10.0.13.192 netmask 255.255.255.192 {
  range 10.0.13.200 10.0.13.254;
  option routers 10.0.13.193;
}

# HR
subnet 10.0.14.0 netmask 255.255.255.192 {
  range 10.0.14.10 10.0.14.62;
  option routers 10.0.14.1;
}

# Finance
subnet 10.0.14.64 netmask 255.255.255.224 {
  range 10.0.14.75 10.0.14.94;
  option routers 10.0.14.65;
}

# QA/Testing
subnet 10.0.14.96 netmask 255.255.255.240 {
  range 10.0.14.100 10.0.14.110;
  option routers 10.0.14.97;
}

# IT/Helpdesk
subnet 10.0.14.112 netmask 255.255.255.240 {
  range 10.0.14.116 10.0.14.126;
  option routers 10.0.14.113;
}

# Management/NOC - static only, no pool (server + router mgmt interfaces sit here manually)

# MAN (Corp switch mgmt: SwAcc1/2, SwD1/2, SwC) - static only, no pool
