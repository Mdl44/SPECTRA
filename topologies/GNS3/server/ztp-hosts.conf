# =========================================================================
# ZTP-HOSTS.CONF - rezervari DHCP per-MAC pentru Zero-Touch Provisioning
# =========================================================================
# Acest fisier e inclus automat in subnetul Management (10.0.14.128/28)
# din dhcpd.conf. Aplicatia Flask scrie/rescrie DOAR acest fisier cand
# adauga un echipament nou - restul din dhcpd.conf nu se atinge.
#
# Dupa orice modificare: service isc-dhcp-server restart
#
# Flux: echipamentul nou se conecteaza temporar in Management, boot fara
# startup-config -> DHCP DISCOVER -> primeste fixed-address + next-server
# (TFTP) + filename -> descarca automat configul si il aplica (AutoInstall)
# -> abia dupa asta il muti fizic in reteaua/portul lui final.
#
# Exemplu (sterge comentariile si pune MAC-ul real cand adaugi un device):
#
# host r-rd {
#   hardware ethernet 00:50:79:66:68:01;
#   fixed-address 10.0.14.133;
#   option host-name "R-RD";
#   next-server 10.0.14.142;
#   filename "configs/r-rd.cfg";
# }
